<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colección — Bernardita Barresi</title>
<meta name="description" content="La colección completa de Bernardita Barresi: sandalias, chatas y guillerminas de cuero hechas a mano. Envíos a todo el país.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="container">
    <nav class="breadcrumb"><a href="index.html">Inicio</a> &gt; Colección</nav>
  </div>

  <section class="section-tight" style="padding-bottom:0;">
    <div class="container">
      <h1 style="text-align:center;">Colección</h1>
      <p class="section-subtitle">Todos nuestros modelos, hechos a mano en cuero en nuestro taller de Monte Grande.</p>
      <nav class="filter-bar" id="category-nav" aria-label="Categorías" style="justify-content:center;"></nav>
    </div>
  </section>

  <div id="collection-sections"></div>

  <section class="section-tight">
    <div class="container">
      <div class="transfer-banner" style="max-width:560px;margin:0 auto;justify-content:center;">
        🏷️ 10% OFF pagando por transferencia · Primer cambio gratis
      </div>
    </div>
  </section>
</main>

<div id="wa-float" class="wa-float"></div>
<div id="site-footer"></div>

<script src="assets/js/products.js"></script>
<script src="assets/js/pixel.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  renderHeader("coleccion");
  renderFooter();

  const cats = categoriesWithProducts();
  document.getElementById("category-nav").innerHTML = cats
    .map((cat) => `<a class="chip" href="#${cat.key}">${cat.label}</a>`)
    .join("");
  document.getElementById("collection-sections").innerHTML = cats
    .map((cat) => {
      const items = PRODUCTS.filter((p) => p.category === cat.key);
      return `
    <section class="section collection-section" id="${cat.key}">
      <div class="container">
        <div class="collection-head">
          <h2>${cat.label}</h2>
          <span class="collection-count">${items.length} ${items.length === 1 ? "modelo" : "modelos"}</span>
        </div>
        <p class="collection-desc">${cat.description}</p>
        <div class="product-grid">${items.map(productCardHTML).join("")}</div>
      </div>
    </section>`;
    })
    .join("");
</script>
</body>
</html>
