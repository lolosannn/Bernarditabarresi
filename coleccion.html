<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colección — Bernardita Barresi</title>
<meta name="description" content="La colección completa de Bernardita Barresi: sandalias, chatas y guillerminas de cuero hechas a mano. Envíos a todo el país.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="container">
    <nav class="breadcrumb"><a href="index.html">Inicio</a> &gt; Colección</nav>
  </div>

  <section class="section-tight">
    <div class="container">
      <h1 style="text-align:center;">Colección</h1>
      <p class="section-subtitle">Todos nuestros modelos, hechos a mano en cuero en nuestro taller de Monte Grande.</p>
      <div class="filter-bar" id="category-nav" role="group" aria-label="Filtrar por categoría" style="justify-content:center;"></div>
      <div class="product-grid" id="collection-grid"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="transfer-banner" style="max-width:560px;margin:0 auto;justify-content:center;">
        🏷️ 10% OFF pagando por transferencia · Primer cambio gratis
      </div>
    </div>
  </section>
</main>

<div id="wa-float" class="wa-float"></div>
<div id="site-footer"></div>

<script src="assets/js/products.js"></script>
<script src="assets/js/pixel.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  renderHeader("coleccion");
  renderFooter();

  // Todos los modelos juntos; si se elige una categoría (o se entra con
  // coleccion.html#sandalias, por ejemplo) se muestra solo esa.
  const cats = categoriesWithProducts();
  const nav = document.getElementById("category-nav");
  nav.innerHTML = [{ key: "", label: "Todos" }, ...cats]
    .map((cat) => `<button class="chip" data-cat="${cat.key}" aria-pressed="false">${cat.label}</button>`)
    .join("");

  function showCategory(key) {
    if (!cats.some((c) => c.key === key)) key = "";
    const list = key ? PRODUCTS.filter((p) => p.category === key) : PRODUCTS;
    document.getElementById("collection-grid").innerHTML = list.map(productCardHTML).join("");
    nav.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === key)));
  }

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    history.replaceState(null, "", btn.dataset.cat ? `#${btn.dataset.cat}` : location.pathname);
    showCategory(btn.dataset.cat);
  });
  window.addEventListener("hashchange", () => showCategory(location.hash.slice(1)));
  showCategory(location.hash.slice(1));
</script>
</body>
</html>
